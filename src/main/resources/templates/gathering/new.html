<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${editId != null} ? '모임 수정 - 나들이' : '모임 만들기 - 나들이'">모임 만들기 - 나들이</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/weather-picker.css}">
  <link rel="stylesheet" th:href="@{/css/select-menu.css}">
</head>
<body class="form-page">
<header class="topbar">
  <a href="/" class="logo"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.2c0 5.1-7 11-7 11s-7-5.9-7-11a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4" fill="currentColor" stroke="none"/></svg></span><span>나들이</span></a>
  <div th:replace="~{fragments/auth :: auth}"></div>
</header>

<div class="container">
  <div class="page-heading" th:if="${editId == null}"><p class="eyebrow">모임 등록</p><h1>새 모임 만들기</h1><p class="page-intro">이름·활동·시간·장소·정원을 입력하면 주변 모임 검색에 등록됩니다.</p></div>
  <div class="page-heading" th:if="${editId != null}"><p class="eyebrow">모임 수정</p><h1>모임 정보 고치기</h1><p class="page-intro">바꾼 내용은 저장하면 바로 모임 상세와 주변 검색에 반영됩니다.</p></div>

  <div class="errors" th:if="${errors}">
    <p th:each="e : ${errors}" th:text="${e.defaultMessage}"></p>
  </div>

  <!--/* 만들기·수정 공용 폼: editId가 있으면 수정 주소로 보낸다 */-->
  <form method="post" th:action="${editId != null} ? @{/gatherings/{id}/edit(id=${editId})} : @{/gatherings}" class="card">
    <label for="title">모임 이름</label>
    <input id="title" name="title" required maxlength="100" placeholder="예) 한강 노을 피크닉" th:value="${f.title}">

    <label for="tag">활동 종류</label>
    <select id="tag" name="tag" required data-menu>
      <option th:each="t : ${tags}" th:value="${t.name()}" th:text="${t.emoji + ' ' + t.label}" th:selected="${t.name() == f.tag}"></option>
    </select>

    <!-- 날씨를 보면서 날짜·시간 고르기. 실제로 서버에 보내는 값은 숨은 칸 startAt (예: 2026-11-19T15:30) -->
    <label id="startAtLabel">시작 시간 <span class="field-help-inline">한국 시간</span></label>
    <input type="hidden" id="startAt" name="startAt" required th:value="${f.startAt}">
    <div class="wx-picker" aria-labelledby="startAtLabel">
      <div class="wx-source">
        <span id="wxSource">날씨 기준: 지도 중심</span>
        <span id="wxRange" class="wx-range"></span>
      </div>

      <div class="wx-days-wrap">
        <div class="wx-days" id="wxDays" role="group" aria-label="날짜 선택"></div>
      </div>
      <div class="wx-far">
        <button type="button" class="wx-far-toggle" id="wxFarToggle">더 먼 날짜 선택</button>
        <input type="date" id="wxFarDate" aria-label="더 먼 날짜" hidden>
      </div>

      <div class="wx-hours-wrap" id="wxHoursWrap">
        <div class="wx-hours" id="wxHours" role="group" aria-label="시간 선택"></div>
      </div>

      <div class="wx-minutes" role="group" aria-label="분 선택">
        <span class="wx-minutes-label">분</span>
        <button type="button" data-minute="0" aria-pressed="true">00</button>
        <button type="button" data-minute="15" aria-pressed="false">15</button>
        <button type="button" data-minute="30" aria-pressed="false">30</button>
        <button type="button" data-minute="45" aria-pressed="false">45</button>
      </div>

      <div class="wx-summary" id="wxSummary" aria-live="polite"></div>
    </div>

    <!--/* 진행 시간: 끝나는 시간 = 시작 + 진행 시간 (서버에서 계산) */-->
    <label for="durationMinutes">진행 시간</label>
    <select id="durationMinutes" name="durationMinutes" required data-menu>
      <option th:each="d : ${f.durationOptions()}" th:value="${d.minutes}" th:text="${d.label}"
              th:selected="${d.minutes == f.durationMinutes}">2시간</option>
    </select>
    <p class="field-help" id="endHint">끝나는 시간이 지나면 모임이 '종료'로 바뀌고 주변 검색에서 빠집니다.</p>

    <label for="maxPeople">최대 인원</label>
    <input id="maxPeople" name="maxPeople" type="number" min="2" max="50" required th:value="${f.maxPeople}">
    <p class="field-help">주최자를 포함한 총 인원입니다. 2명부터 50명까지 설정할 수 있습니다.</p>

    <label for="placeSearch">장소</label>
    <div class="search-row">
      <input id="placeSearch" type="search" placeholder="장소 검색 (예: 여의도 한강공원)" autocomplete="off">
      <button type="button" class="btn secondary" id="searchBtn">검색</button>
    </div>
    <ul id="searchResults" class="search-results"></ul>
    <div class="pick-map-wrap">
      <div id="pickMap"></div>
      <!-- 지도를 내 위치로 옮기는 버튼 (type=button 이라 폼을 제출하지 않음) -->
      <button type="button" class="map-locate-button" id="pickLocateButton" aria-label="지도를 내 위치로 이동" title="내 위치로 이동">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
          <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
        </svg>
      </button>
      <div id="pickMapToast" class="map-toast" role="status" aria-live="polite" hidden></div>
    </div>
    <p class="field-help">검색 결과를 선택하거나 지도에서 모임 장소를 클릭하세요.</p>
    <label class="visually-hidden" for="placeName">모임 장소 이름</label>
    <input id="placeName" name="placeName" required placeholder="모임 장소 이름" th:value="${f.placeName}">
    <input type="hidden" id="latitude" name="latitude" th:value="${f.latitude}">
    <input type="hidden" id="longitude" name="longitude" th:value="${f.longitude}">

    <label for="description">모임 설명 <span class="field-help-inline">선택</span></label>
    <textarea id="description" name="description" rows="4" maxlength="1000" placeholder="준비물이나 만날 위치를 적어 주세요." th:text="${f.description}"></textarea>

    <div class="form-actions">
      <button class="btn" type="submit" th:text="${editId != null} ? '수정 저장' : '모임 등록'">모임 등록</button>
      <a class="btn secondary" th:href="${editId != null} ? @{/gatherings/{id}(id=${editId})} : @{/}">취소</a>
    </div>
  </form>
</div>

<script th:src="@{/js/select-menu.js}"></script>
<script th:src="@{//dapi.kakao.com/v2/maps/sdk.js(appkey=${kakaoJsKey},libraries='services',autoload=false)}"></script>
<script th:src="@{/js/gathering-form.js}"></script>
</body>
</html>
