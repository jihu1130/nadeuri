<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title th:text="${g.title} + ' 채팅 - 나들이'">모임 채팅 - 나들이</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body class="chat-page">
<header class="topbar">
  <a href="/" class="logo"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.2c0 5.1-7 11-7 11s-7-5.9-7-11a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4" fill="currentColor" stroke="none"/></svg></span><span>나들이</span></a>
  <div th:replace="~{fragments/auth :: auth}"></div>
</header>

<main class="chat-shell" th:attr="data-gathering-id=${g.publicId},data-me=${me}">
  <!--/* 채팅방 머리: 어느 모임인지, 상세로 돌아가기, 연결 상태 */-->
  <div class="chat-head">
    <a class="chat-back" th:href="@{/gatherings/{id}(id=${g.publicId})}" aria-label="모임 상세로 돌아가기">←</a>
    <div class="chat-head-copy">
      <strong th:text="${g.tag.emoji + ' ' + g.title}">모임 이름</strong>
      <span>
        <span class="status-badge" th:classappend="${status.cssClass}" th:text="${status.label}">모집 중</span>
        <span th:text="${#temporals.format(g.startAt, 'M월 d일 (E) HH:mm') + ' · 참여자 ' + memberCount + '명'}">시간 · 인원</span>
      </span>
    </div>
    <span class="chat-conn" id="chatConn" role="status" aria-live="polite">연결 중…</span>
  </div>

  <div class="chat-log" id="chatLog" aria-live="polite" aria-label="채팅 메시지">
    <button type="button" class="chat-more" id="chatMore" hidden>이전 메시지 더 보기</button>
    <p class="chat-empty" id="chatEmpty" hidden>아직 메시지가 없어요. 첫 인사를 남겨 보세요 👋</p>
    <div id="chatList"></div>
  </div>

  <!--/* 다른 사람이 입력 중일 때 "○○님이 입력 중…" (chat-room.js가 채움) */-->
  <p class="chat-typing" id="chatTyping" aria-live="polite" hidden></p>
  <!--/* 내 메시지 "수정"을 누르면 보이는 줄 (chat-room.js) */-->
  <div class="chat-editing" id="chatEditing" hidden>
    <span>메시지 수정 중 · Enter로 저장, Esc로 취소</span>
    <button type="button" class="chat-editing-cancel" id="chatEditCancel">취소</button>
  </div>
  <form class="chat-form" id="chatForm" autocomplete="off">
    <label class="visually-hidden" for="chatInput">메시지</label>
    <!--/* "@" 뒤에 글자를 치면 뜨는 참여자 목록 (chat-room.js) */-->
    <ul class="chat-mentions" id="chatMentions" role="listbox" aria-label="부를 참여자" hidden></ul>
    <textarea id="chatInput" rows="1" maxlength="500" placeholder="메시지 입력 (@로 참여자 부르기)" title="Enter: 보내기 · Shift+Enter: 줄바꿈 · @: 참여자 부르기"
              role="combobox" aria-autocomplete="list" aria-controls="chatMentions" aria-expanded="false"></textarea>
    <button class="btn" type="submit" id="chatSend" disabled>보내기</button>
  </form>
  <p class="chat-error" id="chatError" role="alert" hidden></p>
</main>

<script th:src="@{/js/confirm.js}"></script>
<script th:src="@{/js/chat-room.js}"></script>
</body>
</html>
