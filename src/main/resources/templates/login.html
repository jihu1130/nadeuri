<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - 나들이</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-layout">
  <a href="/" class="auth-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.2c0 5.1-7 11-7 11s-7-5.9-7-11a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4" fill="currentColor" stroke="none"/></svg></span><span>나들이</span></a>
  <div class="card login-card">
    <h1>로그인</h1>
    <p class="meta">모임 등록과 참여에 사용할 계정으로 로그인하세요.</p>

    <div class="flash" th:if="${message}" th:text="${message}"></div>
    <div class="errors" th:if="${param.error != null and param.error[0] == 'local'}">
      아이디 또는 비밀번호가 맞지 않습니다. 입력한 정보를 확인하세요.
    </div>
    <div class="errors" th:if="${param.error != null and param.error[0] == 'locked'}">
      비밀번호를 여러 번 틀려서 이 아이디로는 잠시 로그인할 수 없어요. 15분 뒤에 다시 시도해 주세요.
    </div>
    <div class="errors" th:if="${param.error != null and param.error[0] != 'local' and param.error[0] != 'locked'}">
      로그인을 완료하지 못했습니다. 잠시 후 다시 시도하세요.
    </div>

    <!-- 아이디 로그인: Spring Security가 POST /login 을 처리 (th:action이 CSRF 토큰을 넣어 줌) -->
    <form method="post" th:action="@{/login}">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" required autocomplete="username"
             autocapitalize="none" spellcheck="false" maxlength="20" th:value="${username}" placeholder="아이디 입력">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="비밀번호 입력">
      <button type="submit" class="btn btn-block form-submit">로그인</button>
    </form>
    <p class="meta form-foot">
      계정이 없으신가요? <a th:href="@{/signup}" class="link-btn">회원가입</a>
    </p>

    <div class="divider"><span>또는</span></div>

    <div class="social-logins" th:if="${kakaoEnabled or googleEnabled}">
      <a th:if="${kakaoEnabled}" th:href="@{/oauth2/authorization/kakao}" class="btn kakao-btn">
        카카오 계정으로 로그인
      </a>
      <a th:if="${googleEnabled}" th:href="@{/oauth2/authorization/google}" class="btn google-btn">
        <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        구글 계정으로 로그인
      </a>
    </div>
    <p th:unless="${kakaoEnabled or googleEnabled}" class="meta kakao-unavailable">소셜 로그인을 사용할 수 없습니다. 아이디와 비밀번호로 로그인하세요.</p>

    <a href="/" class="browse-link">로그인 없이 모임 둘러보기</a>
  </div>
</main>
</body>
</html>
