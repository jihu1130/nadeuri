<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 - 나들이</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-layout">
  <a href="/" class="auth-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.2c0 5.1-7 11-7 11s-7-5.9-7-11a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4" fill="currentColor" stroke="none"/></svg></span><span>나들이</span></a>
  <div class="card login-card">
    <h1>회원가입</h1>
    <p class="meta">모임 등록과 참여에 사용할 계정을 만드세요.</p>

    <form method="post" th:action="@{/signup}" th:object="${form}" novalidate>
      <label for="username">아이디</label>
      <input id="username" type="text" th:field="*{username}" required minlength="4" maxlength="20"
             autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="영문으로 시작, 영문·숫자·_ 4~20자">
      <p class="field-help">영문으로 시작하고 영문·숫자·밑줄(_)로 4~20자를 입력하세요.</p>
      <p class="errors" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

      <label for="nickname">닉네임</label>
      <input id="nickname" type="text" th:field="*{nickname}" required maxlength="20" placeholder="모임에서 보일 이름">
      <p class="errors" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>

      <label for="password">비밀번호</label>
      <!-- 비밀번호는 오류가 나도 다시 채워 넣지 않는다 -->
      <input id="password" name="password" type="password" required minlength="8" maxlength="64"
             autocomplete="new-password" placeholder="영문과 숫자를 섞어 8자 이상">
      <p class="field-help">영문과 숫자를 각각 1개 이상 포함해 8~64자로 입력하세요.</p>
      <p class="errors" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

      <label for="passwordConfirm">비밀번호 확인</label>
      <input id="passwordConfirm" name="passwordConfirm" type="password" required autocomplete="new-password">
      <p class="errors" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

      <button type="submit" class="btn" style="width:100%; margin-top:16px">가입하기</button>
    </form>
    <p class="meta" style="text-align:center; margin-top:12px">
      이미 계정이 있으신가요? <a th:href="@{/login}" class="link-btn">로그인</a>
    </p>
  </div>
</main>
</body>
</html>
