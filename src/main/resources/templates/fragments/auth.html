<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 상단바 오른쪽: 로그인 상태 표시 (ViewModelAdvice가 loginUser를 넣어 줌) -->
<div th:fragment="auth" class="auth">
  <th:block th:if="${loginUser}">
    <!--/* 사진·닉네임을 누르면 프로필 설정으로 */-->
    <a th:href="@{/me/profile}" class="auth-profile" title="프로필 설정">
      <img th:if="${loginUser.profileImageUrl}" th:src="${loginUser.profileImageUrl}" class="avatar" alt=""
           referrerpolicy="no-referrer">
      <span class="nickname" th:text="${loginUser.nickname}">닉네임</span>
    </a>
    <a th:href="@{/me/gatherings}" class="link-btn">내 모임</a>
    <!-- 로그아웃은 CSRF 토큰이 필요해서 POST 폼으로 보낸다 (th:action이 토큰을 자동으로 넣음) -->
    <form method="post" th:action="@{/logout}" class="inline">
      <button type="submit" class="link-btn">로그아웃</button>
    </form>
  </th:block>
  <th:block th:unless="${loginUser}">
    <a th:href="@{/login}" class="link-btn">로그인</a>
    <a th:href="@{/signup}" class="btn btn-sm">회원가입</a>
  </th:block>
</div>

<!--/* 로그인·회원가입 화면용 상단바: 홈과 같은 로고 + 로그인 상태 (날씨 칩은 홈에서만) */-->
<header th:fragment="topbar" class="topbar">
  <a href="/" class="logo"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.2c0 5.1-7 11-7 11s-7-5.9-7-11a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4" fill="currentColor" stroke="none"/></svg></span><span>나들이</span></a>
  <div class="topbar-right">
    <div th:replace="~{fragments/auth :: auth}"></div>
  </div>
</header>
</body>
</html>
