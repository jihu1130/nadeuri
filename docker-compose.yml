# MySQL을 Docker로 띄울 때: .env.example을 .env로 복사해 비밀번호를 채운 뒤 docker compose up -d
# 비밀번호는 이 파일에 직접 적지 않고 .env(깃에 올리지 않음)에서 읽습니다.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nadeuri
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 파일에 MYSQL_ROOT_PASSWORD를 설정하세요}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"   # 외부에서 DB에 직접 접속하지 못하도록 로컬에만 바인딩
    volumes:
      - mysqldata:/var/lib/mysql
volumes:
  mysqldata:
